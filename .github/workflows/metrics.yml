name: GitHub Metrics

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics.yml'
      - 'README.md'
      - 'README_RU.md'
  schedule:
    - cron: "0 0 * * *" # Ежедневно в 00:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: metrics-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: FROWNINGdev
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Tashkent

          # Languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Achievements (compact)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # Followup (issues/PRs)
          plugin_followup: yes
          plugin_followup_sections: repositories, user

          # Featured repositories (optional)
          plugin_repositories: yes
          plugin_repositories_featured: FROWNINGdev/PTZ-CONTROL, FROWNINGdev/PTZdetect

          # Output
          filename: output/metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update"

